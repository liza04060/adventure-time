<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Игровое поле</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: "Trebuchet MS", Verdana, sans-serif;
            background: #fff;
            color: #222;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
            font-weight: 600;
            text-align: center;
        }

        .intro {
            margin: 0 0 18px;
            color: #666;
            font-size: 14px;
        }

        .layout {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 22px;
        }

        .sidebar {
            width: 150px;
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .player {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 104px;
            margin-bottom: 8px;
            gap: 3px;
            cursor: grab;
        }

        .player span {
            font-size: 13px;
        }

        .avatar {
            display: block;
            width: 76px;
            height: 76px;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: element;
        }

        .game {
            min-width: 0;
        }

        .board-wrap {
            overflow: auto;
        }

        .board {
            position: relative;
            display: grid;
            grid-template-columns: repeat(7, 76px);
            grid-template-rows: repeat(7, 76px);
            gap: 7px;
            width: max-content;
            margin: auto;
        }

        .cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ccc;
            border-radius: 0;
            background: #fff;
        }

        .condition {
            position: absolute;
            top: 5px;
            left: 4px;
            right: 4px;
            color: #5d6b54;
            font-size: 10px;
            line-height: 1.15;
            font-weight: 700;
            text-align: center;
            pointer-events: none;
        }

        .start-label {
            color: #222;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .center {
            grid-row: 2 / 7;
            grid-column: 2 / 7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
        }

        .center img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .tokens {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2px;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .token {
            width: 58px;
            height: 58px;
            object-fit: contain;
            cursor: grab;
            pointer-events: auto;
            user-select: none;
            -webkit-user-drag: element;
        }

        button {
            padding: 9px 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: #222;
            font-family: inherit;
            font-size: 16px;
            text-decoration: underline;
            text-underline-offset: 4px;
            cursor: pointer;
        }

        .dice button {
            width: 100%;
        }

        #dice {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            margin: 12px auto;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 30px;
        }

        .dice p {
            display: none;
        }

        .message {
            min-height: 20px;
            margin-top: 12px;
            font-size: 14px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        @media (max-width: 760px) {
            body {
                padding: 14px;
            }

            .layout {
                flex-direction: column;
                align-items: center;
            }

            .sidebar {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                width: 100%;
            }

            .sidebar section {
                flex: 1;
            }

            .player {
                height: 88px;
            }

            .board {
                grid-template-columns: repeat(7, 54px);
                grid-template-rows: repeat(7, 54px);
                gap: 5px;
            }

            .avatar {
                width: 72px;
                height: 72px;
            }

            .token {
                width: 43px;
                height: 43px;
            }

            .center {
                padding: 6px;
            }
        }
    </style>
</head>
<body>
    <p class="intro">Выбери персонажа и перетащи его на клетку.</p>

    <div class="layout">
        <aside class="sidebar">
            <section>
                <h2>Игроки</h2>

                <div class="player" data-id="1">
                    <img
                        class="avatar"
                        src="images/finn.png"
                        alt="Finn"
                        draggable="true"
                    >
                    <span>Finn</span>
                </div>

                <div class="player" data-id="2">
                    <img
                        class="avatar"
                        src="images/jake.png"
                        alt="Jake"
                        draggable="true"
                    >
                    <span>Jake</span>
                </div>

                <div class="player" data-id="3">
                    <img
                        class="avatar"
                        src="images/marceline.png"
                        alt="Marceline"
                        draggable="true"
                    >
                    <span>Marceline</span>
                </div>
            </section>

            <section class="dice">
                <h2>Кубик</h2>
                <button id="roll">Бросить кубик</button>
                <div id="dice">?</div>
            </section>
        </aside>

        <main class="game">
            <div class="board-wrap">
                <div class="board" id="board">
                    <div class="center" id="center">
                        <img src="images/board.jpg" alt="Игровое поле">
                    </div>
                </div>
            </div>

            <div class="message" id="message">
                Перетащи персонажа на стартовую клетку.
            </div>

            <div class="actions">
                <button id="reset">Начать заново</button>
            </div>
        </main>
    </div>

    <script>
        const board = document.getElementById("board");
        const message = document.getElementById("message");
        const cells = [];
        const route = [];

        const conditions = {
            4: "Брось ещё раз",
            7: "+2 клетки",
            10: "Пропусти ход",
            14: "Назад на 2",
            18: "+2 клетки",
            21: "Брось ещё раз",
            24: "Назад на 2"
        };

        const playerNames = {
            1: "Finn",
            2: "Jake",
            3: "Marceline"
        };

        const playerImages = {
            1: "finn.png",
            2: "jake.png",
            3: "marceline.png"
        };

        let selectedId = null;

        for (let column = 1; column <= 7; column++) {
            route.push([1, column]);
        }

        for (let row = 2; row <= 7; row++) {
            route.push([row, 7]);
        }

        for (let column = 6; column >= 1; column--) {
            route.push([7, column]);
        }

        for (let row = 6; row >= 2; row--) {
            route.push([row, 1]);
        }

        route.forEach((position, index) => {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.style.gridRow = position[0];
            cell.style.gridColumn = position[1];

            if (index === 0) {
                cell.innerHTML = '<span class="condition start-label">СТАРТ</span>';
            } else if (conditions[index + 1]) {
                cell.innerHTML =
                    '<span class="condition">' + conditions[index + 1] + "</span>";
            }

            const tokens = document.createElement("div");
            tokens.className = "tokens";
            cell.appendChild(tokens);

            cell.addEventListener("dragover", (event) => {
                event.preventDefault();
                event.dataTransfer.dropEffect = "move";
            });

            cell.addEventListener("drop", (event) => {
                event.preventDefault();
                const id = event.dataTransfer.getData("text/plain")
                    || event.dataTransfer.getData("text");

                if (id) {
                    movePlayer(id, index);
                }
            });

            cell.addEventListener("click", () => {
                if (selectedId) {
                    movePlayer(selectedId, index);
                }
            });

            board.appendChild(cell);
            cells.push(cell);
        });

        function setupDrag(element, id) {
            element.draggable = true;

            element.addEventListener("dragstart", (event) => {
                selectedId = String(id);

                if (event.dataTransfer) {
                    event.dataTransfer.setData("text/plain", String(id));
                    event.dataTransfer.setData("text", String(id));
                    event.dataTransfer.effectAllowed = "move";
                }
            });

            element.addEventListener("click", (event) => {
                event.stopPropagation();
                selectedId = String(id);
                message.textContent =
                    "Выбран " + playerNames[id] + ". Нажми на клетку.";
            });
        }

        document.querySelectorAll(".player").forEach((player) => {
            player.draggable = false;

            const avatar = player.querySelector(".avatar");
            setupDrag(avatar, player.dataset.id);

            player.addEventListener("click", (event) => {
                event.stopPropagation();
                selectedId = String(player.dataset.id);
                message.textContent =
                    "Выбран " + playerNames[player.dataset.id] + ". Нажми на клетку.";
            });
        });

        function movePlayer(id, place) {
            document.querySelectorAll(".token").forEach((token) => {
                if (token.dataset.id === String(id)) {
                    token.remove();
                }
            });

            const image = document.createElement("img");
            image.className = "token";
            image.src = "images/" + playerImages[id];
            image.alt = playerNames[id] || ("Игрок " + id);
            image.dataset.id = String(id);

            setupDrag(image, id);
            cells[place].querySelector(".tokens").appendChild(image);

            selectedId = String(id);

            if (place === 0) {
                message.textContent = playerNames[id] + " на старте.";
            } else if (place === route.length - 1) {
                message.textContent = playerNames[id] + " на финише.";
            } else {
                message.textContent =
                    playerNames[id] + " на клетке " + (place + 1) + ".";
            }
        }

        document.getElementById("roll").addEventListener("click", () => {
            const number = Math.floor(Math.random() * 6) + 1;
            document.getElementById("dice").textContent = number;
            message.textContent = "Выпало " + number + ". Перемести персонажа.";
        });

        document.getElementById("reset").addEventListener("click", () => {
            document.querySelectorAll(".token").forEach((token) => token.remove());
            selectedId = null;
            document.getElementById("dice").textContent = "?";
            message.textContent =
                "Игра сброшена. Перетащи персонажа на старт.";
        });
    </script>
</body>
</html>
